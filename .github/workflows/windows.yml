# Windows installers (.msi + NSIS .exe) built on a real Windows runner.
# Run it from the Actions tab ("Run workflow") or push a tag like v0.1.0.
name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci --no-audit --no-fund

      - run: npx tauri build

      # Smoke test: the app must start (WebView2 is preinstalled on the
      # runner) and still be alive 20 s later.
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath src-tauri/target/release/pingrid.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "Pingrid exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id
          "binary: {0:N1} MB" -f ((Get-Item src-tauri/target/release/pingrid.exe).Length / 1MB)

      - uses: actions/upload-artifact@v7
        with:
          name: pingrid-windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
